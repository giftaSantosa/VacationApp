version: '3.8'

services:
  my-mysqldb:
    image: mysql:8.0
    container_name: my-mysqldb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: my-mysqldb
    ports:
      - "3306:3306"
    volumes:
      - my-mysql-data:/var/lib/mysql
    networks:
      - vacation-network

  app:
    build: .
    container_name: vacation-app
    restart: unless-stopped
    depends_on:
      - my-mysqldb
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://my-mysqldb:3306/my-mysqldb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: your_root_password
    networks:
      - vacation-network

volumes:
  my-mysql-data:

networks:
  vacation-network:
